name: Sponsor

on:
  workflow_dispatch:      # 保留手动触发
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点自动运行

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure svg directory exists
        run: mkdir -p svg

      - name: Run ifdian-sponsor action
        uses: Sn0wo2/afdian-sponsor@v1
        with:
          version: latest
          cache: true
        env:
          # Required
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_API_TOKEN: ${{ secrets.AFDIAN_API_TOKEN }}

          # Optional
          AFDIAN_OUTPUT: ./svg/afdian-sponsor.svg
          AFDIAN_TOTAL_SPONSORS: 100
          AFDIAN_AVATAR_SIZE: 100
          AFDIAN_MARGIN: 15
          AFDIAN_AVATARS_PER_ROW: 15
          # 🌟 在这里改为 ZCOOL XiaoWei
          AFDIAN_FONT_FAMILY: ZCOOL XiaoWei
          AFDIAN_FONT_FILE: ./font.ttf
          AFDIAN_FONTSIZE_SCALE: 8
          AFDIAN_PADDINGX_SCALE: 2
          AFDIAN_PADDINGY_SCALE: 4
          AFDIAN_SORT: time

      - name: Commit and push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add svg/afdian-sponsor.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update afdian sponsor svg"
            git push
          fi

      - name: Upload generated SVG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: afdian-sponsor-svg
          path: svg/afdian-sponsor.svg
