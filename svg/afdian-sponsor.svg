<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1810 162"><style>.active-text,.expired-text{font-family:afdian sponsor,noto sans sc,sans-serif}.active-text{fill:#000;font-weight:700}.expired-text{fill:#666}.separator{stroke:#eee}@media(prefers-color-scheme:dark){.active-text,.expired-text{fill:#fff}.separator{stroke:#333}}@keyframes pop-out{from{opacity:0;transform:translate(var(--tx,0),var(--ty,0))scale(.5)}to{opacity:1;transform:translate(0,0)scale(1)}}.sponsor-group{animation:pop-out .5s cubic-bezier(.25,1,.5,1)forwards;opacity:0}</style><defs><clipPath id="avatar-clip"><circle cx="0" cy="0" r="50"/></clipPath></defs><g transform="translate(100 75)" opacity=".5"><g class="sponsor-group" style="animation-delay:0s;--tx:805px;--ty:6px"><title>XinGuangIDC</title><image x="-50" y="-50" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)" href="data:image/jpeg;base64,"/><text y="72" text-anchor="middle" font-size="12" class="expired-text">XinGuangIDC</text></g></g></svg>